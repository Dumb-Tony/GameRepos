name: Fetch Tidebound art

# Downloads the generated art assets listed in tidebound/art/manifest.txt,
# converts them to web-optimized WebP (backgrounds 1920w, portraits 512w),
# and commits them into tidebound/art/ on the branch the workflow runs on.
# The images live on a CDN the authoring sandbox cannot reach, so CI does
# the one-time fetch instead. Runs on pushes that change the manifest (or
# this workflow), and can be run manually once it exists on the default
# branch. The commit it makes touches only tidebound/art/*.webp, which the
# paths filter excludes — no trigger loop.

on:
  workflow_dispatch:
  push:
    paths:
      - 'tidebound/art/manifest.txt'
      - '.github/workflows/fetch-tidebound-art.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install webp tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Download and convert art assets
        run: |
          set -euo pipefail
          cd tidebound/art
          while IFS='|' read -r name url; do
            case "$name" in ''|\#*) continue ;; esac
            echo "== $name"
            curl -fsSL --retry 3 --retry-delay 2 -o /tmp/src.png "$url"
            case "$name" in
              bg-*)   cwebp -quiet -q 82 -resize 1920 0 /tmp/src.png -o "$name" ;;
              char-*) cwebp -quiet -q 85 -resize 512  0 /tmp/src.png -o "$name" ;;
              tk-*)   cwebp -quiet -q 85 -resize 256  0 /tmp/src.png -o "$name" ;;
              ph-full*) cwebp -quiet -q 85 -resize 1280 0 /tmp/src.png -o "$name" ;;
              ph-*)   cwebp -quiet -q 85 -resize 320  0 /tmp/src.png -o "$name" ;;
              *)      cwebp -quiet -q 82 /tmp/src.png -o "$name" ;;
            esac
          done < manifest.txt
          ls -la

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tidebound/art
          git diff --cached --quiet && echo "nothing new" || {
            git commit -m "Add Tidebound generated art assets (fetched from art manifest)"
            git push
          }
