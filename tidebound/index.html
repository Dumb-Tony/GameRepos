<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidebound — a survival visual novel</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>

<div id="crashBanner"></div>
<script>
window.onerror = function (msg, src, line) {
  var b = document.getElementById('crashBanner');
  if (b && b.style.display !== 'block') { b.style.display = 'block'; b.textContent = '💥 ' + msg + '  (' + (src || '').split('/').pop() + ':' + line + ')'; }
};
</script>

<!-- ===== SCENE BACKDROP (CSS-painted, class set by engine) ===== -->
<div id="backdrop" class="bg-title">
  <div class="sky"></div>
  <div class="sun"></div>
  <div class="sea"></div>
  <div class="sand"></div>
  <div class="palms" aria-hidden="true">🌴&nbsp;&nbsp;🌴</div>
  <div class="art" aria-hidden="true"></div>
</div>

<!-- ===== TOP HUD ===== -->
<header id="hud" class="hidden">
  <div class="clock">
    <span id="hudDay">Day 1</span><span class="dot">·</span><span id="hudSeg">🌅 Dawn</span>
  </div>
  <div class="meters">
    <div class="meter" title="Health"><span class="mi">❤️</span><div class="bar"><div id="mHealth" class="fill f-health"></div></div></div>
    <div class="meter" title="Hunger"><span class="mi">🍖</span><div class="bar"><div id="mHunger" class="fill f-hunger"></div></div></div>
    <div class="meter" title="Thirst"><span class="mi">💧</span><div class="bar"><div id="mThirst" class="fill f-thirst"></div></div></div>
    <div class="meter" title="Energy"><span class="mi">⚡</span><div class="bar"><div id="mEnergy" class="fill f-energy"></div></div></div>
    <div class="meter" title="Hope"><span class="mi">🕯️</span><div class="bar"><div id="mHope" class="fill f-hope"></div></div></div>
  </div>
  <button id="kitBtn" title="Your kit &amp; what you know">🎒</button>
  <button id="sndBtn" title="Sound on/off">🔊</button>
  <button id="menuBtn" title="Menu (TAB)">☰</button>
</header>

<!-- ===== VN PANEL ===== -->
<main id="stage">
  <div id="portrait" class="hidden"><img id="portraitImg" class="hidden" alt=""><span id="portraitEmoji">🐕</span><span id="portraitName"></span></div>
  <section id="panel">
    <div id="textLog" aria-live="polite"></div>
    <div id="moreHint" class="hidden">▼</div>
    <div id="choices"></div>
  </section>
</main>

<!-- ===== KIT OVERLAY ===== -->
<div id="kitOverlay" class="hidden">
  <div id="kitCard">
    <h2>🎒 Your kit</h2>
    <div id="kitItems"></div>
    <h2>🧭 What you know</h2>
    <div id="kitFacts"></div>
    <button id="kitClose">Close</button>
  </div>
</div>

<!-- ===== IN-GAME MENU (TAB) ===== -->
<div id="menuOverlay" class="hidden">
  <div id="menuCard">
    <h2>⚙️ Menu <span class="menuHint">— TAB to open/close</span></h2>
    <div class="mRow"><label for="mVol">🔊 Volume</label><input id="mVol" type="range" min="0" max="100" step="1"></div>
    <div class="mRow"><label for="mBright">☀️ Brightness</label><input id="mBright" type="range" min="50" max="130" step="1"></div>
    <div class="mRow mChecks">
      <label><input id="mAmb" type="checkbox"> Ambient sound</label>
      <label><input id="mSfx" type="checkbox"> Animal calls</label>
    </div>
    <h2>💾 Saves</h2>
    <div class="mSlot"><span id="autoLabel">—</span><span class="mSlotBtns"><button id="autoLoad">Load</button></span></div>
    <div class="mSlot"><span id="slotLabel1">—</span><span class="mSlotBtns"><button id="slotSave1">Save</button><button id="slotLoad1">Load</button></span></div>
    <div class="mSlot"><span id="slotLabel2">—</span><span class="mSlotBtns"><button id="slotSave2">Save</button><button id="slotLoad2">Load</button></span></div>
    <div class="mSlot"><span id="slotLabel3">—</span><span class="mSlotBtns"><button id="slotSave3">Save</button><button id="slotLoad3">Load</button></span></div>
    <div class="mBtns"><button id="menuTitle">🏝️ Title screen</button><button id="menuClose">Resume ➤</button></div>
  </div>
</div>

<script src="engine.js?v=7"></script>
<script src="audio.js?v=7"></script>
<script src="menu.js?v=7"></script>
<script src="scenes-prologue.js?v=7"></script>
<script src="scenes-chapter1.js?v=7"></script>
<script src="scenes-chapter2.js?v=7"></script>
<script src="scenes-chapter3.js?v=7"></script>
<script src="scenes-chapter4.js?v=7"></script>
<script src="scenes-chapter5.js?v=7"></script>
<script src="scenes-chapter6.js?v=7"></script>
<script src="scenes-chapter7.js?v=7"></script>
<script src="scenes-extra.js?v=7"></script>
<script src="scenes-quests.js?v=7"></script>
<script>window.TB.start();</script>
</body>
</html>
